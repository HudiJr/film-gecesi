<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Gecesi 🎬</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Üst Header */
        header { padding: 10px 15px; background-color: #1e1e1e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .room-controls input { padding: 6px 10px; border-radius: 4px; border: none; background: #2a2a2a; color: #fff; }
        .room-controls button { padding: 6px 12px; background: #e50914; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        /* Ana Gövde */
        .main-container { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
        @media (min-width: 768px) { .main-container { flex-direction: row; } }
        
        /* Video Alanı */
        .video-section { flex: 2; display: flex; flex-direction: column; background-color: #000; padding: 10px; justify-content: center; align-items: center; position: relative; }
        .video-input { width: 100%; display: flex; gap: 10px; margin-bottom: 10px; }
        .video-input input { flex: 1; padding: 8px; border-radius: 4px; border: none; background: #222; color: #fff; }
        .video-input button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        video { width: 100%; max-height: 60vh; border-radius: 8px; background: #000; }
        
        /* Yan Panel (Kamera & Chat) */
        .sidebar { flex: 1; display: flex; flex-direction: column; background: #181818; border-top: 1px solid #333; }
        @media (min-width: 768px) { .sidebar { border-top: none; border-left: 1px solid #333; } }
        
        /* Kamera Alanı */
        .cameras-container { display: flex; gap: 10px; padding: 10px; background: #111; justify-content: center; height: 120px; }
        .video-box { flex: 1; max-width: 150px; height: 100%; background: #222; border-radius: 6px; overflow: hidden; position: relative; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Chat Alanı */
        .chat-container { flex: 1; display: flex; flex-direction: column; padding: 10px; overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; background: #222; border-radius: 6px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
        .message { background: #333; padding: 6px 10px; border-radius: 6px; font-size: 14px; max-width: 80%; }
        .message.self { background: #005c4b; align-self: flex-end; }
        .chat-input { display: flex; gap: 8px; }
        .chat-input input { flex: 1; padding: 8px; border-radius: 4px; border: none; background: #222; color: #fff; }
        .chat-input button { padding: 8px 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h2>Film Gecesi 🍿</h2>
        <div class="room-controls">
            <input type="text" id="roomInput" placeholder="Oda Adı (örn: aşkım)" value="film123">
            <button id="joinBtn">Odaya Katıl</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Video Alanı -->
        <div class="video-section">
            <div class="video-input">
                <input type="text" id="videoUrlInput" placeholder="Video Linki Yapıştır (.mp4 vb.)">
                <button id="loadVideoBtn">Yükle</button>
            </div>
            <video id="mainVideo" controls>
                <source id="videoSource" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                Tarayıcınız video etiketini desteklemiyor.
            </video>
        </div>

        <!-- Kamera ve Chat Alanı -->
        <div class="sidebar">
            <div class="cameras-container">
                <div class="video-box">
                    <video id="localVideo" autoplay muted playsinline></video>
                </div>
                <div class="video-box">
                    <video id="remoteVideo" autoplay playsinline></video>
                </div>
            </div>

            <div class="chat-container">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="msgInput" placeholder="Mesaj yaz...">
                    <button id="sendBtn">Gönder</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
