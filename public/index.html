<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Film Gecesi 🍿</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <header class="header">
        <h1>Film Gecesi 🍿</h1>
        <div class="room-controls">
            <input type="text" id="usernameInput" placeholder="Adınız" value="Kullanıcı">
            <input type="text" id="roomInput" placeholder="Oda Adı" value="film123">
            <input type="password" id="passwordInput" placeholder="Şifre">
            <button id="createRoomBtn" class="btn-create">Oda Kur ➕</button>
            <button id="joinRoomBtn" class="btn-join">Odaya Katıl 🚪</button>
            <button id="leaveBtn" class="leave-btn" style="display: none;">Odadan Ayrıl 🚪</button>
        </div>
    </header>

    <!-- Aktif Odalar Arayüzü -->
    <div class="rooms-bar">
        <span class="rooms-title">Açık Odalar:</span>
        <div id="roomsList" class="rooms-list">Henüz aktif oda yok</div>
    </div>

    <div class="main-container">
        <!-- Sol Taraf: Medya ve Ekran Paylaşımı -->
        <div class="video-section">
            <div class="platform-bar">
                <button class="plat-btn netflix" onclick="window.open('https://www.netflix.com', '_blank')">Netflix ↗</button>
                <button id="ytModalBtn" class="plat-btn youtube">YouTube 🎬</button>
                <button class="plat-btn google" onclick="window.open('https://www.google.com', '_blank')">Google ↗</button>
                <button id="shareScreenBtn" class="plat-btn screen-share">🖥️ Ekranımı Paylaş</button>
            </div>

            <!-- YouTube Link veya Arama Giriş Barı -->
            <div id="ytInputBar" class="yt-input-bar" style="display: none;">
                <input type="text" id="ytUrlInput" placeholder="YouTube linki yapıştırın veya aranacak kelime yazın...">
                <button id="ytLoadBtn">Oynat / Ara</button>
            </div>

            <div class="player-wrapper">
                <video id="mainVideo" controls playsinline style="display: block;"></video>
                <iframe id="ytPlayer" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen style="display: none; width: 100%; height: 100%;"></iframe>
                <div id="noStreamPlaceholder" class="placeholder-box">
                    <p>📺 Henüz yayın başlatılmadı.</p>
                    <small>Bilgisayardan "Ekranımı Paylaş" veya "YouTube" butonuna basarak yayın başlatabilirsiniz.</small>
                </div>
            </div>
        </div>

        <!-- Sağ Taraf / Mobil Alt Taraf: Kameralar ve Sohbet -->
        <div class="sidebar">
            <div class="cameras-grid" id="camerasGrid">
                <div class="camera-card" id="card-local">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <span class="cam-label">Siz</span>
                </div>
            </div>

            <div class="media-controls">
                <button id="toggleMicBtn" class="control-btn">🎤 Mikrofon: Açık</button>
                <button id="toggleCamBtn" class="control-btn">📷 Kamera: Açık</button>
            </div>

            <div class="chat-container">
                <div id="chatMessages" class="chat-messages"></div>
                <div class="chat-input-bar">
                    <input type="text" id="msgInput" placeholder="Mesaj yazın...">
                    <button id="sendBtn">Gönder</button>
                </div>
            </div>
        </div>
    </div>

    <script src="client.js"></script>
</body>
</html>
