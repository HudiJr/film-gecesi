<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Gecesi 🍿</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <header class="header">
        <h1>Film Gecesi 🍿</h1>
        <div class="room-controls">
            <input type="text" id="usernameInput" placeholder="Adınız..." value="Kullanıcı">
            <input type="text" id="roomInput" placeholder="Oda Adı..." value="film123">
            <button id="joinBtn">Odaya Katıl</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Sol Taraf: Video Oynatıcı ve Hazır Platformlar -->
        <div class="video-section">
            <div class="platform-bar">
                <button class="plat-btn netflix" onclick="window.open('https://www.netflix.com', '_blank')">Netflix ↗</button>
                <button class="plat-btn youtube" onclick="window.open('https://www.youtube.com', '_blank')">YouTube ↗</button>
                <button class="plat-btn drive" onclick="window.open('https://drive.google.com', '_blank')">Google Drive ↗</button>
            </div>

            <div class="url-bar">
                <input type="text" id="videoUrlInput" placeholder="Doğrudan MP4 veya Drive video linki yapıştırın...">
                <button id="loadVideoBtn">Yükle</button>
            </div>

            <div class="player-wrapper">
                <video id="mainVideo" controls></video>
            </div>
        </div>

        <!-- Sağ Taraf: Kameralar ve Sohbet -->
        <div class="sidebar">
            <div class="cameras-container">
                <div class="camera-card">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <span class="cam-label">Siz</span>
                </div>
            </div>

            <div class="media-controls">
                <button id="toggleMicBtn" class="control-btn">🎤 Mikrofon: Açık</button>
                <button id="toggleCamBtn" class="control-btn">📷 Kamera: Açık</button>
            </div>

            <div class="chat-container">
                <div id="chatMessages" class="chat-messages"></div>
                <div class="chat-input-bar">
                    <input type="text" id="msgInput" placeholder="Mesaj yazın...">
                    <button id="sendBtn">Gönder</button>
                </div>
            </div>
        </div>
    </div>

    <script src="client.js"></script>
</body>
</html>
