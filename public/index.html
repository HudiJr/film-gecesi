<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Gecesi 🍿</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <header class="header">
        <h1>Film Gecesi 🍿</h1>
        <div class="room-controls">
            <input type="text" id="usernameInput" placeholder="Adınız..." value="Kullanıcı">
            <input type="text" id="roomInput" placeholder="Oda Adı..." value="film123">
            <input type="password" id="passwordInput" placeholder="Şifre (Opsiyonel)">
            <button id="joinBtn">Odaya Katıl</button>
            <button id="leaveBtn" class="leave-btn" style="display: none;">Odadan Ayrıl</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Sol Taraf: Video ve Platformlar -->
        <div class="video-section">
            <div class="platform-bar">
                <button class="plat-btn netflix" onclick="window.open('https://www.netflix.com', '_blank')">Netflix ↗</button>
                <button class="plat-btn youtube" onclick="window.open('https://www.youtube.com', '_blank')">YouTube ↗</button>
                <button class="plat-btn google" onclick="window.open('https://www.google.com', '_blank')">Google ↗</button>
                <button id="shareScreenBtn" class="plat-btn screen-share">🖥️ Ekranımı Paylaş (Netflix/Sistem)</button>
            </div>

            <div class="url-bar">
                <input type="text" id="videoUrlInput" placeholder="MP4, Google Drive veya YouTube linki yapıştırın...">
                <button id="loadVideoBtn">Yükle</button>
            </div>

            <div class="player-wrapper" id="playerWrapper">
                <!-- HTML5 MP4 / Ekran Paylaşımı -->
                <video id="mainVideo" controls style="display: block;"></video>
                <!-- YouTube Gömülü Oynatıcı -->
                <div id="ytPlayer" style="display: none;"></div>
            </div>
        </div>

        <!-- Sağ Taraf: 6'lı Kamera Grid ve Chat -->
        <div class="sidebar">
            <div class="cameras-grid" id="camerasGrid">
                <div class="camera-card" id="card-local">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <span class="cam-label">Siz</span>
                </div>
            </div>

            <div class="media-controls">
                <button id="toggleMicBtn" class="control-btn">🎤 Mikrofon: Açık</button>
                <button id="toggleCamBtn" class="control-btn">📷 Kamera: Açık</button>
            </div>

            <div class="chat-container">
                <div id="chatMessages" class="chat-messages"></div>
                <div class="chat-input-bar">
                    <input type="text" id="msgInput" placeholder="Mesaj yazın...">
                    <button id="sendBtn">Gönder</button>
                </div>
            </div>
        </div>
    </div>

    <script src="client.js"></script>
</body>
</html>
